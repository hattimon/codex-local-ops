name: Bug report
description: Report a reproducible Codex Local Ops problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, SSH private material, cookies, browser profiles, private config, or unredacted logs.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Codex Local Ops version
      placeholder: 0.1.0b1
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.12.x
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the command/tool and minimal sanitized steps.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include only reviewed, non-sensitive diagnostics or error text.
  - type: dropdown
    id: native-session
    attributes:
      label: Does it reproduce outside a sandbox/headless runner?
      options:
        - "Yes"
        - "No"
        - "Not tested"
    validations:
      required: true
