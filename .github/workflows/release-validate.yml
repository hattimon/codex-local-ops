name: Release validation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Verify package version
        run: python -c "import pathlib, tomllib; data=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); print(data['project']['version'])"
      - name: Upload release-candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-local-ops-${{ github.ref_name }}
          path: dist/*

# This workflow intentionally does not publish packages or create a GitHub
# Release. Publishing remains a separate, explicit maintainer action.
