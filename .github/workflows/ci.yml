name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            backend: windows
          - os: ubuntu-latest
            backend: linux
          - os: macos-latest
            backend: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip
      - name: Install
        run: python -m pip install -e ".[dev,desktop,browser,obs,windows]"
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m pytest -m "not interactive"
      - name: MCP STDIO smoke
        run: python scripts/mcp_smoke.py
      - name: Platform detection
        env:
          EXPECTED_BACKEND: ${{ matrix.backend }}
        run: python -c "import os; from codex_local_ops.platforms.factory import current_backend; actual=current_backend().name; expected=os.environ['EXPECTED_BACKEND']; print(f'backend={actual} expected={expected}'); assert actual == expected"
      - name: Build wheel and sdist
        run: python -m build
      - name: Check package metadata
        run: python -c "import glob, subprocess, sys; files=glob.glob('dist/*'); assert files; raise SystemExit(subprocess.call([sys.executable, '-m', 'twine', 'check', *files]))"
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-local-ops-dist-${{ matrix.backend }}
          path: dist/*
